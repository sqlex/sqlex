[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/cli",
    "crates/analyzer/sqlex-analyzer",
    "crates/analyzer/sqlex-database-analyzer",
    "crates/analyzer/sqlex-static-analyzer",
    "crates/generator/sqlex-generator",
    "crates/generator/sqlex-generator-rust",
    "crates/generator/sqlex-generator-go",
    "crates/generator/sqlex-generator-java",
    "crates/compiler",
    "crates/generator/sqlex-generator-debug",
]

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
sqlparser = "0.54"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros"] }
testcontainers = "0.23"
notify = "8.2.0"
serde_json = "1.0"
rand = "0.8"
