[workspace]
resolver = "2"
members = [
    "crates/sqlex-types",
    "crates/sqlex-parser",
    "crates/sqlex-schema",
    "crates/sqlex-migration",
    "crates/sqlex-analyzer",
    "crates/sqlex-tests",
    "sqlex",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Internal crates
sqlex-types = { path = "crates/sqlex-types" }
sqlex-parser = { path = "crates/sqlex-parser" }
sqlex-schema = { path = "crates/sqlex-schema" }
sqlex-migration = { path = "crates/sqlex-migration" }
sqlex-analyzer = { path = "crates/sqlex-analyzer" }

# External dependencies
sqlparser = "0.55"
thiserror = "2.0"
regex = "1.11"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "mysql",
    "sqlite",
] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "mysql"] }
clap = { version = "4.4", features = ["derive", "env"] }
colored = "2.0"
walkdir = "2.3"
uuid = { version = "1.0", features = ["v4"] }
tempfile = "3.15"
