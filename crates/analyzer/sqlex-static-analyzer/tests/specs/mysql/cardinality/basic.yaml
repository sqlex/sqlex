dialect: mysql
migrations:
  - |
    CREATE TABLE users (
      id INT PRIMARY KEY,
      name TEXT NOT NULL,
      email TEXT
    )
  - |
    CREATE TABLE orders (
      id INT PRIMARY KEY,
      user_id INT NOT NULL,
      total DECIMAL
    )

queries:
  # WHERE FALSE should return ExactlyZero
  - name: where_false
    sql: SELECT * FROM users WHERE FALSE
    cardinality: ExactlyZero
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  # WHERE 1=0 should return ExactlyZero
  - name: where_constant_false
    sql: SELECT * FROM users WHERE 1 = 0
    cardinality: ExactlyZero
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  # GROUP BY should return ZeroOrMore
  - name: group_by
    sql: SELECT user_id, SUM(total) as total_sum FROM orders GROUP BY user_id
    cardinality: ZeroOrMore
    expected:
      - name: user_id
        nullability: false
      - name: total_sum
        nullability: true

  # DISTINCT should return ZeroOrMore
  - name: distinct
    sql: SELECT DISTINCT name FROM users
    cardinality: ZeroOrMore
    expected:
      - name: name
        nullability: false

  # Aggregate without GROUP BY should return ExactlyOne
  - name: aggregate_no_group_by
    sql: SELECT COUNT(*) as cnt, SUM(total) as total_sum FROM orders
    cardinality: ExactlyOne
    expected:
      - name: cnt
        nullability: false
      - name: total_sum
        nullability: true

  # LIMIT 0 should return ExactlyZero
  - name: limit_zero
    sql: SELECT * FROM users LIMIT 0
    cardinality: ExactlyZero
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  # LIMIT 1 should return AtMostOne
  - name: limit_one
    sql: SELECT * FROM users LIMIT 1
    cardinality: AtMostOne
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  # No FROM clause should return ExactlyOne
  - name: no_from_clause
    sql: SELECT 1 as one, 2 as two, 3 as three
    cardinality: ExactlyOne
    expected:
      - name: one
        nullability: false
      - name: two
        nullability: false
      - name: three
        nullability: false

  # UNION should combine cardinality
  - name: union_single_rows
    sql: SELECT 1 as num UNION SELECT 2
    cardinality: OneOrMore
    expected:
      - name: num
        nullability: false

  # INTERSECT lower bound is conservative zero
  - name: intersect_single_rows
    sql: SELECT 1 as num INTERSECT SELECT 1
    cardinality: AtMostOne
    expected:
      - name: num
        nullability: false

  # EXCEPT lower bound is conservative zero when right may be non-empty
  - name: except_single_rows
    sql: SELECT 1 as num EXCEPT SELECT 2
    cardinality: AtMostOne
    expected:
      - name: num
        nullability: false

  # LIMIT 1 with OFFSET should remain AtMostOne
  - name: limit_one_with_offset
    sql: SELECT * FROM users LIMIT 1 OFFSET 1
    cardinality: AtMostOne
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  # OFFSET on singleton input should be ExactlyZero
  - name: offset_singleton_is_zero
    sql: SELECT 1 as one LIMIT 10 OFFSET 1
    cardinality: ExactlyZero
    expected:
      - name: one
        nullability: false
