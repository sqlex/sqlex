dialect: mysql
migrations:
  - |
    CREATE TABLE test_table (
      id INT NOT NULL,
      name TEXT NOT NULL,
      amount DECIMAL
    )
queries:
  # String functions with non-text arguments - MySQL auto-converts
  - name: upper_on_numeric
    sql: SELECT UPPER(id) FROM test_table
    cardinality: Unknown
    expected:
      - name: UPPER(id)
        nullability: false

  - name: lower_on_numeric
    sql: SELECT LOWER(amount) FROM test_table
    cardinality: Unknown
    expected:
      - name: LOWER(amount)
        nullability: true

  - name: trim_on_numeric
    sql: SELECT TRIM(id) FROM test_table
    cardinality: Unknown
    expected:
      - name: TRIM(id)
        nullability: false

  - name: length_on_numeric
    sql: SELECT LENGTH(id) FROM test_table
    cardinality: Unknown
    expected:
      - name: LENGTH(id)
        nullability: false

  # Numeric functions with non-numeric arguments - MySQL auto-converts
  - name: abs_on_text
    sql: SELECT ABS(name) FROM test_table
    cardinality: Unknown
    expected:
      - name: ABS(name)
        nullability: false

  - name: ceil_on_text
    sql: SELECT CEIL(name) FROM test_table
    cardinality: Unknown
    expected:
      - name: CEIL(name)
        nullability: false

  - name: floor_on_text
    sql: SELECT FLOOR(name) FROM test_table
    cardinality: Unknown
    expected:
      - name: FLOOR(name)
        nullability: false

  - name: round_on_text
    sql: SELECT ROUND(name) FROM test_table
    cardinality: Unknown
    expected:
      - name: ROUND(name)
        nullability: false
