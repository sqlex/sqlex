dialect: mysql
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT,
      amount DECIMAL
    )
queries:
  - name: min_max_nullable
    sql: SELECT MIN(amount) AS min_amt, MAX(amount) AS max_amt FROM sales
    cardinality: ExactlyOne
    expected:
      - name: min_amt
        nullability: true
      - name: max_amt
        nullability: true

  - name: group_by_expression
    sql: |
      SELECT region, COUNT(*) AS cnt
      FROM sales
      GROUP BY region
    cardinality: Unknown
    expected:
      - name: region
        nullability: true
      - name: cnt
        nullability: false
