dialect: mysql
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      age INT
    )
queries:
  - name: ambiguous_column
    sql: |
      SELECT id FROM users u1 JOIN users u2 ON u1.id = u2.id

  - name: invalid_function_args
    sql: SELECT SUBSTR(1, 2, 3, 4) FROM users

  - name: invalid_group_by
    sql: SELECT name, COUNT(*) FROM users

  - name: table_name_hidden_by_alias
    sql: SELECT users.id FROM users AS u

  - name: missing_column_in_where
    sql: SELECT id FROM users WHERE missing_col = 1

  - name: join_using_missing_column
    sql: SELECT * FROM users u1 JOIN users u2 USING (missing_col)

  - name: reserved_alias
    sql: SELECT id, RANK() OVER (ORDER BY age) AS rank FROM users

  - name: reserved_alias_row_number
    sql: SELECT id, ROW_NUMBER() OVER (ORDER BY age) AS row_number FROM users

  - name: reserved_alias_select
    sql: SELECT id AS select FROM users

  - name: reserved_alias_window
    sql: SELECT id AS window FROM users

  - name: reserved_table_alias
    sql: SELECT id FROM users AS select

  - name: reserved_derived_column_alias
    sql: SELECT * FROM (SELECT id FROM users) AS t(select)
