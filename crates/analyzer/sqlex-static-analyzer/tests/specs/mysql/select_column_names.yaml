dialects:
- mysql
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name VARCHAR(255) NOT NULL,
      email VARCHAR(255),
      age INT,
      score DOUBLE
    )
queries:
  # Test string literal expression without aliases
  - name: string_literal_without_alias
    sql: SELECT 'hello' FROM users
    cardinality: ZeroOrMore
    expected:
      - name: "hello"
        nullability: false

  # Test COUNT(1) without alias
  - name: count_one_without_alias
    sql: SELECT COUNT(1) FROM users
    cardinality: ExactlyOne
    expected:
      - name: "COUNT(1)"
        nullability: false
