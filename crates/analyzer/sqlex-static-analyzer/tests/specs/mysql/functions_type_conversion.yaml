dialects:
- mysql
migrations:
  - |
    CREATE TABLE test_table (
      id INT NOT NULL,
      name TEXT NOT NULL,
      amount DECIMAL
    )
queries:
  # MySQL-specific success cases.
  - name: ceil_on_text
    sql: SELECT CEIL(name) FROM test_table
    cardinality: ZeroOrMore
    expected:
      - name: CEIL(name)
        nullability: false

  - name: floor_on_text
    sql: SELECT FLOOR(name) FROM test_table
    cardinality: ZeroOrMore
    expected:
      - name: FLOOR(name)
        nullability: false
