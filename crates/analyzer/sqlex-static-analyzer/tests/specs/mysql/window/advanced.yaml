dialect: mysql
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT NOT NULL,
      amount DECIMAL NOT NULL
    )
queries:
  - name: row_number_partition
    sql: |
      SELECT id,
             ROW_NUMBER() OVER (PARTITION BY region ORDER BY id) AS rn
      FROM sales
    expected:
      - name: id
        nullability: false
      - name: rn
        nullability: false

  - name: sum_over_window
    sql: |
      SELECT id,
             SUM(amount) OVER (PARTITION BY region ORDER BY id) AS running_sum
      FROM sales
    expected:
      - name: id
        nullability: false
      - name: running_sum
        nullability: true

  - name: named_window_reference
    sql: |
      SELECT id,
             SUM(amount) OVER w AS running_sum
      FROM sales
      WINDOW w AS (PARTITION BY region ORDER BY id)
    expected:
      - name: id
        nullability: false
      - name: running_sum
        nullability: true
