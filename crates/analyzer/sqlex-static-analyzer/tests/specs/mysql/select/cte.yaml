dialect: mysql
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      age INT
    )
queries:
  - name: basic_cte_reference
    sql: |
      WITH u AS (
        SELECT id, name FROM users
      )
      SELECT id, name FROM u
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false

  - name: cte_column_aliases
    sql: |
      WITH u(user_id, user_name) AS (
        SELECT id, name FROM users
      )
      SELECT user_id, user_name FROM u
    expected:
      - name: user_id
        nullability: false
      - name: user_name
        nullability: false

  - name: chained_ctes
    sql: |
      WITH a AS (
        SELECT id FROM users
      ),
      b AS (
        SELECT id FROM a
      )
      SELECT id FROM b
    expected:
      - name: id
        nullability: false

  - name: cte_in_join
    sql: |
      WITH ids AS (
        SELECT id FROM users
      )
      SELECT u.id AS base_id, i.id AS cte_id
      FROM users u
      JOIN ids i ON u.id = i.id
    expected:
      - name: base_id
        nullability: false
      - name: cte_id
        nullability: false

  - name: recursive_cte
    sql: |
      WITH RECURSIVE nums(n) AS (
        SELECT 1
        UNION ALL
        SELECT n + 1 FROM nums WHERE n < 3
      )
      SELECT n FROM nums
    cardinality: AtLeastOne
    expected:
      - name: n
        nullability: false
