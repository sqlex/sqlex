dialect: mysql
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      email TEXT,
      age INT
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT NOT NULL,
      total DECIMAL,
      status TEXT
    )
queries:
  - name: derived_table
    sql: |
      SELECT t.user_id, t.total
      FROM (SELECT user_id, total FROM orders) AS t
    expected:
      - name: user_id
        nullability: false
      - name: total
        nullability: true

  - name: qualified_wildcard_derived_table
    sql: |
      SELECT t.*
      FROM (SELECT user_id FROM orders) AS t
    expected:
      - name: user_id
        nullability: false

  - name: scalar_subquery
    sql: |
      SELECT id,
             (SELECT MAX(total) FROM orders o WHERE o.user_id = users.id) AS max_total
      FROM users
    expected:
      - name: id
        nullability: false
      - name: max_total
        nullability: true

  - name: exists_subquery
    sql: |
      SELECT id FROM users
      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = users.id)
    expected:
      - name: id
        nullability: false

  - name: in_subquery
    sql: |
      SELECT id FROM users
      WHERE id IN (SELECT user_id FROM orders)
    expected:
      - name: id
        nullability: false
