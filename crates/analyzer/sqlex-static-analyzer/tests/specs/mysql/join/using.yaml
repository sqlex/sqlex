dialect: mysql
migrations:
  - |
    CREATE TABLE a (
      id INT NOT NULL,
      value TEXT
    )
  - |
    CREATE TABLE b (
      id INT NOT NULL,
      value TEXT NOT NULL
    )
queries:
  - name: join_using
    sql: |
      SELECT id, a.value, b.value
      FROM a JOIN b USING (id)
    expected:
      - name: id
        nullability: false
      - name: value
        nullability: true
      - name: value
        nullability: false
