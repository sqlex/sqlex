dialect: mysql
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT,
      total DECIMAL
    )
queries:
  - name: left_join_derived
    sql: |
      SELECT u.id, t.total
      FROM users u
      LEFT JOIN (SELECT user_id, total FROM orders) t ON u.id = t.user_id
    expected:
      - name: id
        nullability: false
      - name: total
        nullability: true

  - name: inner_join_derived
    sql: |
      SELECT u.id, t.total
      FROM users u
      INNER JOIN (SELECT user_id, total FROM orders) t ON u.id = t.user_id
    expected:
      - name: id
        nullability: false
      - name: total
        nullability: true
