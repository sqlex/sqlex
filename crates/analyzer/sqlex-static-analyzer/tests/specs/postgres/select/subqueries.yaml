dialect: postgres
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      email TEXT,
      age INT
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT NOT NULL,
      total DECIMAL,
      status TEXT
    )
queries:
  - name: correlated_scalar_subquery
    sql: |
      SELECT u.id,
             (SELECT COUNT(*) FROM orders o WHERE o.user_id = u.id) AS order_count
      FROM users u
    expected:
      - name: id
        nullability: false
      - name: order_count
        nullability: false

  - name: derived_table_filter
    sql: |
      SELECT t.user_id
      FROM (SELECT user_id, total FROM orders WHERE status IS NOT NULL) t
    expected:
      - name: user_id
        nullability: false

  - name: in_subquery_distinct
    sql: |
      SELECT id FROM users
      WHERE id IN (SELECT DISTINCT user_id FROM orders)
    expected:
      - name: id
        nullability: false

  - name: exists_subquery_projection
    sql: |
      SELECT name FROM users u
      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = u.id AND o.total > 0)
    expected:
      - name: name
        nullability: false

  - name: nested_correlated_scalar_subquery
    sql: |
      SELECT u.id,
             (SELECT (SELECT COUNT(*) FROM orders o2 WHERE o2.user_id = u.id)) AS nested_order_count
      FROM users u
    expected:
      - name: id
        nullability: false
      - name: nested_order_count
        nullability: false

  - name: correlated_scalar_passthrough
    sql: |
      SELECT u.id,
             (SELECT u.id) AS echoed_id
      FROM users u
    expected:
      - name: id
        nullability: false
      - name: echoed_id
        nullability: false
