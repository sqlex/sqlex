dialects:
- postgres
migrations:
- |
  CREATE TABLE users (
    id INT PRIMARY KEY,
    email TEXT UNIQUE,
    name TEXT NOT NULL,
    age INT
  )
queries:
- name: single_pk_parameter
  sql: SELECT * FROM users WHERE id = $1
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
