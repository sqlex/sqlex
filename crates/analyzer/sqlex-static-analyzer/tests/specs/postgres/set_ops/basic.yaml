dialect: postgres
migrations:
  - |
    CREATE TABLE table_a (
      id INT NOT NULL,
      value TEXT
    )
  - |
    CREATE TABLE table_b (
      id INT NOT NULL,
      value TEXT NOT NULL
    )
queries:
  - name: union_nullability
    sql: |
      SELECT id, value FROM table_a
      UNION
      SELECT id, value FROM table_b
    expected:
      - name: id
        nullability: false
      - name: value
        nullability: true

  - name: union_all
    sql: |
      SELECT id FROM table_a
      UNION ALL
      SELECT id FROM table_b
    expected:
      - name: id
        nullability: false

  - name: intersect
    sql: |
      SELECT id FROM table_a
      INTERSECT
      SELECT id FROM table_b
    expected:
      - name: id
        nullability: false

  - name: except
    sql: |
      SELECT id FROM table_a
      EXCEPT
      SELECT id FROM table_b
    expected:
      - name: id
        nullability: false

  - name: except_inherits_left_nullability
    sql: |
      SELECT id, value FROM table_b
      EXCEPT
      SELECT id, value FROM table_a
    expected:
      - name: id
        nullability: false
      - name: value
        nullability: false
