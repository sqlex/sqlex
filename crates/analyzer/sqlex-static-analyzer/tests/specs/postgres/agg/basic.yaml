dialect: postgres
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT NOT NULL,
      amount DECIMAL
    )
queries:
  - name: group_by_sum
    sql: |
      SELECT region, SUM(amount) AS sum
      FROM sales
      GROUP BY region
    cardinality: Unknown
    expected:
      - name: region
        nullability: false
      - name: sum
        nullability: true

  - name: group_by_count
    sql: |
      SELECT region, COUNT(*) AS cnt
      FROM sales
      GROUP BY region
    cardinality: Unknown
    expected:
      - name: region
        nullability: false
      - name: cnt
        nullability: false

  - name: having_clause
    sql: |
      SELECT region, COUNT(*) AS cnt
      FROM sales
      GROUP BY region
      HAVING COUNT(*) > 1
    cardinality: Unknown
    expected:
      - name: region
        nullability: false
      - name: cnt
        nullability: false

  - name: count_nullable_column
    sql: |
      SELECT COUNT(amount) AS cnt
      FROM sales
    cardinality: ExactlyOne
    expected:
      - name: cnt
        nullability: false

  - name: aggregate_with_table_alias
    sql: |
      SELECT SUM(s.amount)
      FROM sales s
    cardinality: ExactlyOne
    expected:
      - name: sum
        nullability: true
