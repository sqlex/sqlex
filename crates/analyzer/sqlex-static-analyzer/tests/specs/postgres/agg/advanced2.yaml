dialect: postgres
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT,
      amount DECIMAL
    )

tables:
  - name: sales
    columns:
      - name: id
        type: Int
        nullability: false
      - name: region
        type: Text
        nullability: true
      - name: amount
        type: Decimal
        nullability: true

queries:
  - name: min_max_nullable
    sql: SELECT MIN(amount) AS min_amt, MAX(amount) AS max_amt FROM sales
    expected:
      - name: min_amt
        type: Double
        nullability: true
      - name: max_amt
        type: Double
        nullability: true

  - name: group_by_expression
    sql: |
      SELECT region, COUNT(*) AS cnt
      FROM sales
      GROUP BY region
    expected:
      - name: region
        type: Text
        nullability: true
      - name: cnt
        type: BigInt
        nullability: false
