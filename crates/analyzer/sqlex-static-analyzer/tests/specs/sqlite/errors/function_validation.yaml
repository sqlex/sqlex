dialect: sqlite
migrations:
  - |
    CREATE TABLE test_table (
      id INT NOT NULL,
      name TEXT NOT NULL,
      amount DECIMAL
    )
queries:
  # SQLite does not support CEIL/FLOOR on text types
  - name: ceil_on_text
    sql: SELECT CEIL(name) FROM test_table

  - name: floor_on_text
    sql: SELECT FLOOR(name) FROM test_table
