dialect: sqlite
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      age INT
    )
queries:
  - name: missing_table
    sql: SELECT id FROM missing_table

  - name: missing_column
    sql: SELECT missing_col FROM users

  - name: type_mismatch
    sql: SELECT length(1, 2) FROM users

  - name: syntax_error
    sql: SELECT FROM users
