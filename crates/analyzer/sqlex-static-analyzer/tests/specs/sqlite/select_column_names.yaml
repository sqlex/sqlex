dialects:
- sqlite
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      email TEXT,
      age INT,
      score DOUBLE PRECISION
    )
queries:
  # Test string literal expression without aliases
  - name: string_literal_without_alias
    sql: SELECT 'hello' FROM users
    cardinality: ZeroOrMore
    expected:
      - name: "'hello'"
        nullability: false

  # Test SUM without alias
  - name: sum_without_alias
    sql: SELECT SUM(age) FROM users
    cardinality: ExactlyOne
    expected:
      - name: "SUM(age)"
        nullability: true
