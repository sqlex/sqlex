dialects:
- sqlite
migrations:
- |
  CREATE TABLE users (
    id INT NOT NULL,
    name TEXT NOT NULL,
    age INT
  )
queries:
- name: non_recursive_self_reference
  sql: |
    WITH a AS (
      SELECT 1 AS n
      UNION ALL
      SELECT n + 1 FROM a WHERE n < 3
    )
    SELECT n FROM a
  cardinality: OneOrMore
  expected:
  - name: "n"
    nullability: false
- name: cte_forward_reference
  sql: |
    WITH a AS (SELECT n FROM b),
         b AS (SELECT 1 AS n)
    SELECT n FROM a
  cardinality: ExactlyOne
  expected:
  - name: "n"
    nullability: false
