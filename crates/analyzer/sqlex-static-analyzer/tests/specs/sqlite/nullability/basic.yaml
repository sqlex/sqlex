dialect: sqlite
migrations:
  - |
    CREATE TABLE data (
      a INT NOT NULL,
      b INT,
      c TEXT,
      d TEXT
    )

tables:
  - name: data
    columns:
      - name: a
        type: Int
        nullability: false
      - name: b
        type: Int
        nullability: true
      - name: c
        type: Text
        nullability: true
      - name: d
        type: Text
        nullability: true

queries:
  - name: coalesce_not_nullable
    sql: SELECT COALESCE(b, a) AS v FROM data
    expected:
      - name: v
        type: Int
        nullability: false

  - name: coalesce_nullable
    sql: SELECT COALESCE(c, d) AS v FROM data
    expected:
      - name: v
        type: Text
        nullability: true

  - name: case_with_else_null
    sql: |
      SELECT CASE WHEN b IS NULL THEN a ELSE NULL END AS v FROM data
    expected:
      - name: v
        type: Int
        nullability: true

  - name: arithmetic_nullable
    sql: SELECT b + 1 AS v FROM data
    expected:
      - name: v
        type: Int
        nullability: true
