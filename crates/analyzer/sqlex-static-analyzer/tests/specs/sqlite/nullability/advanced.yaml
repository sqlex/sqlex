dialect: sqlite
migrations:
  - |
    CREATE TABLE data (
      a INT NOT NULL,
      b INT,
      c TEXT,
      d TEXT
    )
queries:
  - name: case_all_not_null
    sql: |
      SELECT CASE WHEN a > 0 THEN a ELSE 1 END AS v FROM data
    expected:
      - name: v
        nullability: false

  - name: case_nullable_branch
    sql: |
      SELECT CASE WHEN a > 0 THEN b ELSE a END AS v FROM data
    expected:
      - name: v
        nullability: true

  - name: nullif_nullable
    sql: SELECT NULLIF(a, b) AS v FROM data
    expected:
      - name: v
        nullability: true

  - name: coalesce_chain
    sql: SELECT COALESCE(b, a, 0) AS v FROM data
    expected:
      - name: v
        nullability: false

  - name: in_subquery_consumes_subquery_nullability
    sql: SELECT a IN (SELECT b FROM data) AS in_sub FROM data
    expected:
      - name: in_sub
        nullability: true
