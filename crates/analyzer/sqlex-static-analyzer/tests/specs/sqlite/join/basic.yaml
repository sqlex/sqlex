dialect: sqlite
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      PRIMARY KEY (id)
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT,
      amount DECIMAL NOT NULL,
      PRIMARY KEY (id)
    )

tables:
  - name: users
    columns:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
  - name: orders
    columns:
      - name: id
        type: Int
        nullability: false
      - name: user_id
        type: Int
        nullability: true
      - name: amount
        type: Decimal
        nullability: false

queries:
  - name: inner_join
    sql: |
      SELECT u.id, u.name, o.amount
      FROM users u
      INNER JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
      - name: amount
        type: Decimal
        nullability: false

  - name: left_join
    sql: |
      SELECT u.id, o.id, o.amount
      FROM users u
      LEFT JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: false
      - name: id
        type: Int
        nullability: true
      - name: amount
        type: Decimal
        nullability: true

  - name: right_join
    sql: |
      SELECT u.id, u.name, o.amount
      FROM users u
      RIGHT JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: true
      - name: name
        type: Text
        nullability: true
      - name: amount
        type: Decimal
        nullability: false

  - name: full_join
    sql: |
      SELECT u.id, o.id
      FROM users u
      FULL JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: true
      - name: id
        type: Int
        nullability: true
