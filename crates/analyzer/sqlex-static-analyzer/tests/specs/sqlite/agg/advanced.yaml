dialect: sqlite
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT,
      amount DECIMAL
    )
queries:
  - name: avg_amount
    sql: SELECT AVG(amount) AS avg_amount FROM sales
    expected:
      - name: avg_amount
        nullability: true

  - name: count_distinct
    sql: SELECT COUNT(DISTINCT region) AS cnt FROM sales
    expected:
      - name: cnt
        nullability: false

  - name: group_by_having_nullable_group
    sql: |
      SELECT region, COUNT(*) AS cnt
      FROM sales
      GROUP BY region
      HAVING region IS NOT NULL
    expected:
      - name: region
        nullability: true
      - name: cnt
        nullability: false
