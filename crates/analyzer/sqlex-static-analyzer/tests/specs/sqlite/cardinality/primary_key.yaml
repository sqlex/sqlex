dialects:
- sqlite
migrations:
- |
  CREATE TABLE products (
    sku TEXT PRIMARY KEY,
    name TEXT NOT NULL,
    price REAL
  )
queries:
- name: string_pk_equality
  sql: SELECT * FROM products WHERE sku = 'ABC123'
  cardinality: AtMostOne
  expected:
  - name: sku
    nullability: true
  - name: name
    nullability: false
  - name: price
    nullability: true
