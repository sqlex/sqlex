dialect: sqlite
migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      email TEXT,
      age INT
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT NOT NULL,
      total DECIMAL,
      status TEXT
    )

tables:
  - name: users
    columns:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
      - name: email
        type: Text
        nullability: true
      - name: age
        type: Int
        nullability: true
  - name: orders
    columns:
      - name: id
        type: Int
        nullability: false
      - name: user_id
        type: Int
        nullability: false
      - name: total
        type: Decimal
        nullability: true
      - name: status
        type: Text
        nullability: true

queries:
  - name: derived_table
    sql: |
      SELECT t.user_id, t.total
      FROM (SELECT user_id, total FROM orders) AS t
    expected:
      - name: user_id
        type: Int
        nullability: false
      - name: total
        type: Decimal
        nullability: true

  - name: scalar_subquery
    sql: |
      SELECT id,
             (SELECT MAX(total) FROM orders o WHERE o.user_id = users.id) AS max_total
      FROM users
    expected:
      - name: id
        type: Int
        nullability: false
      - name: max_total
        type: Double
        nullability: true

  - name: exists_subquery
    sql: |
      SELECT id FROM users
      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.user_id = users.id)
    expected:
      - name: id
        type: Int
        nullability: false

  - name: in_subquery
    sql: |
      SELECT id FROM users
      WHERE id IN (SELECT user_id FROM orders)
    expected:
      - name: id
        type: Int
        nullability: false
