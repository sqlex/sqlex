dialect: sqlite
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT NOT NULL,
      amount DECIMAL NOT NULL
    )
queries:
  - name: row_number
    sql: SELECT id, ROW_NUMBER() OVER (ORDER BY id) AS row_number FROM sales
    expected:
      - name: id
        nullability: false
      - name: row_number
        nullability: false

  - name: rank
    sql: SELECT id, RANK() OVER (ORDER BY amount) AS rank FROM sales
    expected:
      - name: id
        nullability: false
      - name: rank
        nullability: false

  - name: dense_rank
    sql: SELECT id, DENSE_RANK() OVER (ORDER BY amount) AS dense_rank FROM sales
    expected:
      - name: id
        nullability: false
      - name: dense_rank
        nullability: false

  - name: lead_lag
    sql: |
      SELECT id,
        LEAD(amount) OVER (ORDER BY id) AS lead,
        LAG(amount) OVER (ORDER BY id) AS lag
      FROM sales
    expected:
      - name: id
        nullability: false
      - name: lead
        nullability: true
      - name: lag
        nullability: true
