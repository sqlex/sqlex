dialect: sqlite
migrations:
  - |
    CREATE TABLE sales (
      id INT NOT NULL,
      region TEXT NOT NULL,
      amount DECIMAL NOT NULL
    )

tables:
  - name: sales
    columns:
      - name: id
        type: Int
        nullability: false
      - name: region
        type: Text
        nullability: false
      - name: amount
        type: Decimal
        nullability: false

queries:
  - name: row_number_partition
    sql: |
      SELECT id,
             ROW_NUMBER() OVER (PARTITION BY region ORDER BY id) AS rn
      FROM sales
    expected:
      - name: id
        type: Int
        nullability: false
      - name: rn
        type: BigInt
        nullability: false

  - name: sum_over_window
    sql: |
      SELECT id,
             SUM(amount) OVER (PARTITION BY region ORDER BY id) AS running_sum
      FROM sales
    expected:
      - name: id
        type: Int
        nullability: false
      - name: running_sum
        type: Double
        nullability: true
