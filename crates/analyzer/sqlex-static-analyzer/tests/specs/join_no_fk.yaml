schema:
  - |
    CREATE TABLE users (
        id INT NOT NULL,
        name TEXT NOT NULL,
        PRIMARY KEY (id)
    )
  - |
    CREATE TABLE orders (
        id INT NOT NULL,
        user_id INT,
        amount DECIMAL NOT NULL,
        PRIMARY KEY (id)
    )

tests:
  - name: test_inner_join_preserves_nullability
    sql: |
      SELECT u.id, u.name, o.amount 
      FROM users u 
      INNER JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
      - name: amount
        type: Decimal
        nullability: false

  - name: test_left_join_right_columns_nullable
    sql: |
      SELECT u.id, o.id, o.amount 
      FROM users u 
      LEFT JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: false
      - name: id
        type: Int
        nullability: true
      - name: amount
        type: Decimal
        nullability: true

  - name: test_right_join_left_columns_nullable
    sql: |
      SELECT u.id, u.name, o.amount 
      FROM users u 
      RIGHT JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: true
      - name: name
        type: Text
        nullability: true
      - name: amount
        type: Decimal
        nullability: false

  - name: test_full_join_both_sides_nullable
    sql: |
      SELECT u.id, o.id 
      FROM users u 
      FULL OUTER JOIN orders o ON u.id = o.user_id
    expected:
      - name: id
        type: Int
        nullability: true
      - name: id
        type: Int
        nullability: true

  - name: test_cross_join_preserves_nullability
    sql: |
      SELECT u.id, o.amount 
      FROM users u 
      CROSS JOIN orders o
    expected:
      - name: id
        type: Int
        nullability: false
      - name: amount
        type: Decimal
        nullability: false

  - name: test_join_using_clause
    sql: |
      SELECT u.id, u.name
      FROM users u
      INNER JOIN (SELECT id, amount FROM orders) o USING (id)
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
