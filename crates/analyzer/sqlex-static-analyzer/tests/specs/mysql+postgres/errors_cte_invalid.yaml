dialects:
- mysql
- postgres
migrations: []
queries:
- name: non_recursive_self_reference
  sql: |
    WITH a AS (
      SELECT 1 AS n
      UNION ALL
      SELECT n + 1 FROM a
    )
    SELECT * FROM a
  expected_error_code: A0003
- name: cte_forward_reference
  sql: |
    WITH a AS (SELECT * FROM b),
         b AS (SELECT 1 AS n)
    SELECT * FROM a
  expected_error_code: A0003
