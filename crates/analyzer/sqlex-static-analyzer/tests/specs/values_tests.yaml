schema: []

tests:
  - name: test_values_clause_infer_types
    sql: VALUES (1, 'hello')
    expected:
      - name: column1
        type: Int
        nullability: false
      - name: column2
        type: Text
        nullability: false

  - name: test_values_clause_multiple_rows
    sql: VALUES (1, 10), (2, 20)
    expected:
      - name: column1
        type: Int
        nullability: false
      - name: column2
        type: Int
        nullability: false

  - name: test_values_clause_nullability
    sql: VALUES (1), (NULL)
    expected:
      - name: column1
        type: Int
        nullability: true
