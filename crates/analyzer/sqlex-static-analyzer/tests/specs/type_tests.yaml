schema:
  - |
    CREATE TABLE data (
        int_val INT,
        bigint_val BIGINT,
        float_val FLOAT,
        double_val DOUBLE PRECISION,
        text_val TEXT,
        bool_val BOOLEAN,
        decimal_val DECIMAL
    )

tests:
  # Arithmetic Type Promotion
  - name: test_int_plus_bigint
    sql: SELECT int_val + bigint_val as val FROM data
    expected:
      - name: val
        type: BigInt
        nullability: true

  - name: test_int_plus_float
    sql: SELECT int_val + float_val as val FROM data
    expected:
      - name: val
        type: Float
        nullability: true

  - name: test_float_plus_double
    sql: SELECT float_val + double_val as val FROM data
    expected:
      - name: val
        type: Double
        nullability: true

  - name: test_int_plus_decimal
    sql: SELECT int_val + decimal_val as val FROM data
    expected:
      - name: val
        type: Decimal
        nullability: true

  # Division
  - name: test_division_returns_double
    sql: SELECT int_val / 2 as val FROM data
    expected:
      - name: val
        type: Double
        nullability: true

  # Comparison Operations
  - name: test_comparison_returns_bool
    sql: SELECT int_val > 0 as val FROM data
    expected:
      - name: val
        type: Bool
        nullability: true

  - name: test_equality_returns_bool
    sql: SELECT int_val = bigint_val as val FROM data
    expected:
      - name: val
        type: Bool
        nullability: true

  - name: test_logical_and_returns_bool
    sql: SELECT bool_val AND TRUE as val FROM data
    expected:
      - name: val
        type: Bool
        nullability: true

  # Aggregate Return Types
  - name: test_count_returns_bigint
    sql: SELECT COUNT(*) as val FROM data
    expected:
      - name: val
        type: BigInt
        nullability: false

  - name: test_sum_int_returns_bigint
    sql: SELECT SUM(int_val) as val FROM data
    expected:
      - name: val
        type: BigInt
        nullability: true

  - name: test_sum_float_returns_double
    sql: SELECT SUM(float_val) as val FROM data
    expected:
      - name: val
        type: Double
        nullability: true

  - name: test_avg_returns_double
    sql: SELECT AVG(int_val) as val FROM data
    expected:
      - name: val
        type: Double
        nullability: true

  - name: test_min_preserves_type
    sql: SELECT MIN(int_val) as val FROM data
    expected:
      - name: val
        type: Int
        nullability: true

  - name: test_max_preserves_type
    sql: SELECT MAX(text_val) as val FROM data
    expected:
      - name: val
        type: Text
        nullability: true

  # String Operations
  - name: test_string_concat
    sql: SELECT text_val || ' suffix' as val FROM data
    expected:
      - name: val
        type: Text
        nullability: true

  # Literal Types
  - name: test_integer_literal_type
    sql: SELECT 42 as val FROM data
    expected:
      - name: val
        type: Int
        nullability: false

  - name: test_float_literal_type
    sql: SELECT 3.14 as val FROM data
    expected:
      - name: val
        type: Double
        nullability: false

  - name: test_string_literal_type
    sql: SELECT 'hello' as val FROM data
    expected:
      - name: val
        type: Text
        nullability: false

  - name: test_bool_literal_type
    sql: SELECT TRUE as val FROM data
    expected:
      - name: val
        type: Bool
        nullability: false
