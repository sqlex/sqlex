migrations:
  - |
    CREATE TABLE nums (
      id INT NOT NULL,
      val INT
    )
  - |
    CREATE TABLE nums_big (
      id BIGINT NOT NULL,
      val BIGINT
    )
queries:
  - name: union_type_promotion
    sql: |
      SELECT id, val FROM nums
      UNION ALL
      SELECT id, val FROM nums_big
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false
      - name: val
        nullability: true
