migrations:
- |
  CREATE TABLE users (
    id INT PRIMARY KEY,
    email VARCHAR(255) UNIQUE,
    name TEXT NOT NULL,
    age INT
  )
- |
  CREATE TABLE order_items (
    order_id INT NOT NULL,
    item_id INT NOT NULL,
    quantity INT NOT NULL,
    PRIMARY KEY (order_id, item_id)
  )
- |
  CREATE TABLE products (
    sku VARCHAR(50) PRIMARY KEY,
    name TEXT NOT NULL,
    price DECIMAL
  )
queries:
- name: single_pk_equality
  sql: SELECT * FROM users WHERE id = 1
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: unique_constraint_equality
  sql: SELECT * FROM users WHERE email = 'test@example.com'
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: composite_pk_full_match
  sql: SELECT * FROM order_items WHERE order_id = 1 AND item_id = 2
  cardinality: AtMostOne
  expected:
  - name: order_id
    nullability: false
  - name: item_id
    nullability: false
  - name: quantity
    nullability: false
- name: composite_pk_partial_match
  sql: SELECT * FROM order_items WHERE order_id = 1
  cardinality: ZeroOrMore
  expected:
  - name: order_id
    nullability: false
  - name: item_id
    nullability: false
  - name: quantity
    nullability: false
- name: pk_in_single_value
  sql: SELECT * FROM users WHERE id IN (1)
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: pk_in_multiple_values
  sql: SELECT * FROM users WHERE id IN (1, 2, 3)
  cardinality: ZeroOrMore
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: pk_is_null
  sql: SELECT * FROM users WHERE id IS NULL
  cardinality: ExactlyZero
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: pk_with_and_condition
  sql: SELECT * FROM users WHERE id = 1 AND name = 'John'
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: contradictory_pk_equalities
  sql: SELECT * FROM users WHERE id = 1 AND id = 2
  cardinality: ExactlyZero
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: pk_with_or_condition
  sql: SELECT * FROM users WHERE id = 1 OR name = 'John'
  cardinality: ZeroOrMore
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
- name: non_pk_equality
  sql: SELECT * FROM users WHERE name = 'John'
  cardinality: ZeroOrMore
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
