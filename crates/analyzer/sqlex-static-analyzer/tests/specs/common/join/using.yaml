migrations:
  - |
    CREATE TABLE a (
      id INT NOT NULL,
      value TEXT
    )
  - |
    CREATE TABLE b (
      id INT NOT NULL,
      value TEXT NOT NULL
    )
  - |
    CREATE TABLE c (
      id INT,
      value TEXT
    )
queries:
  - name: join_using
    sql: |
      SELECT id, a.value, b.value
      FROM a JOIN b USING (id)
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false
      - name: value
        nullability: true
      - name: value
        nullability: false

  - name: join_using_qualified_id_reference
    sql: |
      SELECT a.id, b.id, id
      FROM a JOIN b USING (id)
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false
      - name: id
        nullability: false
      - name: id
        nullability: false

  - name: left_join_using_merged_nullability
    sql: |
      SELECT id
      FROM a
      LEFT JOIN c USING (id)
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false

  - name: right_join_using_merged_nullability
    sql: |
      SELECT id
      FROM c
      RIGHT JOIN a USING (id)
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false
