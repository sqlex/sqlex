migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL,
      email TEXT,
      age INT,
      score DOUBLE PRECISION
    )
  - |
    CREATE TABLE orders (
      id INT NOT NULL,
      user_id INT NOT NULL,
      total DECIMAL,
      status TEXT
    )
queries:
  - name: select_basic_columns
    sql: SELECT id, name, email FROM users
    cardinality: ZeroOrMore
    expected:
      - name: id
        nullability: false
      - name: name
        nullability: false
      - name: email
        nullability: true

  - name: select_aliases
    sql: SELECT id AS user_id, name AS user_name FROM users
    cardinality: ZeroOrMore
    expected:
      - name: user_id
        nullability: false
      - name: user_name
        nullability: false

  - name: select_literals
    sql: SELECT 1 as c1, 'hello' as c2, 3.14 as c3, TRUE as c4 FROM users
    cardinality: ZeroOrMore
    expected:
      - name: c1
        nullability: false
      - name: c2
        nullability: false
      - name: c3
        nullability: false
      - name: c4
        nullability: false

  - name: select_expression_nullable
    sql: SELECT age + 1 as age_plus FROM users
    cardinality: ZeroOrMore
    expected:
      - name: age_plus
        nullability: true
