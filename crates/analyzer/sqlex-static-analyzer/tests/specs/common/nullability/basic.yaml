migrations:
  - |
    CREATE TABLE data (
      a INT NOT NULL,
      b INT,
      c TEXT,
      d TEXT
    )
queries:
  - name: coalesce_not_nullable
    sql: SELECT COALESCE(b, a) AS v FROM data
    cardinality: ZeroOrMore
    expected:
      - name: v
        nullability: false

  - name: coalesce_nullable
    sql: SELECT COALESCE(c, d) AS v FROM data
    cardinality: ZeroOrMore
    expected:
      - name: v
        nullability: true

  - name: case_with_else_null
    sql: |
      SELECT CASE WHEN b IS NULL THEN a ELSE NULL END AS v FROM data
    cardinality: ZeroOrMore
    expected:
      - name: v
        nullability: true

  - name: arithmetic_nullable
    sql: SELECT b + 1 AS v FROM data
    cardinality: ZeroOrMore
    expected:
      - name: v
        nullability: true
