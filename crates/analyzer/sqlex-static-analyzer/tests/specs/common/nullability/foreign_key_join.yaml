migrations:
- |
  CREATE TABLE users (
    id INT PRIMARY KEY,
    name VARCHAR(100)
  )
- |
  CREATE TABLE posts (
    id INT PRIMARY KEY,
    user_id INT NOT NULL,
    title VARCHAR(200),
    FOREIGN KEY (user_id) REFERENCES users(id)
  )
- |
  CREATE TABLE comments (
    id INT PRIMARY KEY,
    post_id INT,
    content TEXT,
    FOREIGN KEY (post_id) REFERENCES posts(id)
  )
queries:
- name: fk_not_null_guarantees_match
  sql: |
    SELECT p.id, p.user_id, u.id, u.name
    FROM posts p
    LEFT JOIN users u ON p.user_id = u.id
  cardinality: ZeroOrMore
  expected:
  - name: id
    nullability: false
  - name: user_id
    nullability: false
  - name: id
    nullability: false
  - name: name
    nullability: true
- name: fk_nullable_allows_null
  sql: |
    SELECT c.id, c.post_id, p.id, p.title
    FROM comments c
    LEFT JOIN posts p ON c.post_id = p.id
  cardinality: ZeroOrMore
  expected:
  - name: id
    nullability: false
  - name: post_id
    nullability: true
  - name: id
    nullability: true
  - name: title
    nullability: true
