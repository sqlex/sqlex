migrations:
  - |
    CREATE TABLE users (
      id INT NOT NULL,
      name TEXT NOT NULL
    )
queries:
  - name: window_function_without_over
    sql: SELECT ROW_NUMBER() FROM users
    expected_error_code: A0509

  - name: scalar_function_with_over
    sql: SELECT UPPER(name) OVER () FROM users
    expected_error_code: A0508
