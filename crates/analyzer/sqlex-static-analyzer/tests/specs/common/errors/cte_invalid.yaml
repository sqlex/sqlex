migrations: []
queries:
- name: undefined_cte_reference
  sql: |
    WITH a AS (SELECT 1 AS n)
    SELECT * FROM b
  expected_error_code: A0003
- name: duplicate_cte_name
  sql: |
    WITH a AS (SELECT 1 AS n),
         a AS (SELECT 2 AS n)
    SELECT * FROM a
  expected_error_code: A0205
- name: recursive_column_count_mismatch
  sql: |
    WITH RECURSIVE a(n) AS (
      SELECT 1
      UNION ALL
      SELECT n, n + 1 FROM a
    )
    SELECT * FROM a
  expected_error_code: A0206
