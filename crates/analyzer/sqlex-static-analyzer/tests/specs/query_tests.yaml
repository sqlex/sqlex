schema:
  - |
    CREATE TABLE users (
        id INT NOT NULL,
        name TEXT NOT NULL,
        email TEXT,
        age INT,
        PRIMARY KEY (id)
    )
  - |
    CREATE TABLE orders (
        id INT NOT NULL,
        user_id INT NOT NULL,
        amount DECIMAL,
        status TEXT,
        PRIMARY KEY (id),
        FOREIGN KEY (user_id) REFERENCES users(id)
    )

tests:
  # Basic SELECT Tests
  - name: test_select_all_columns
    sql: SELECT * FROM users
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false
      - name: email
        type: Text
        nullability: true
      - name: age
        type: Int
        nullability: true

  - name: test_select_specific_columns
    sql: SELECT id, name FROM users
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false

  - name: test_select_with_alias
    sql: SELECT id AS user_id, name AS user_name FROM users
    expected:
      - name: user_id
        type: Int
        nullability: false
      - name: user_name
        type: Text
        nullability: false

  - name: test_select_with_table_alias
    sql: SELECT u.id, u.name FROM users u
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false

  - name: test_select_literal_values
    sql: SELECT 1 as c1, 'hello' as c2, 3.14 as c3, TRUE as c4 FROM users
    expected:
      - name: c1
        type: Int
        nullability: false
      - name: c2
        type: Text
        nullability: false
      - name: c3
        type: Decimal
        nullability: false
      - name: c4
        type: Bool
        nullability: false

  - name: test_select_null_literal
    sql: SELECT NULL as c1 FROM users
    # NULL literal usually treated as minimal type or void, expecting nullable
    # Analyzer might infer type as Unknown or Custom("NULL").
    # Assuming standard behavior where NULL matches any type but let's see. 
    # Usually it's text or int or unknown.
    # In Rust static analyzer:
    # Expr::Value(Value::Null) => TypedExpr { type_: DataType::Null? no DataType::Null in common types. }
    # DataType has no Null variant. 
    # It might result in DataType::Custom("NULL") or error.
    # checking `type_tests.rs` or known behavior.
    # If not sure, I'll assume Text or skip if it causes issues.
    # Let's try Text and nullable.
    expected:
      - name: c1
        type: Text
        nullability: true

  - name: test_select_expression
    sql: SELECT age + 1 as val FROM users
    expected:
      - name: val
        type: Int
        nullability: true

  - name: test_select_from_subquery
    sql: SELECT sub.id FROM (SELECT id FROM users) sub
    expected:
      - name: id
        type: Int
        nullability: false

  # WHERE Clause Tests
  - name: test_select_with_where
    sql: SELECT id, name FROM users WHERE id > 0
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false

  - name: test_select_with_complex_where
    sql: SELECT id FROM users WHERE id > 0 AND name IS NOT NULL
    expected:
      - name: id
        type: Int
        nullability: false

  # ORDER BY / LIMIT Tests
  - name: test_select_with_order_by
    sql: SELECT id, name FROM users ORDER BY id DESC
    expected:
      - name: id
        type: Int
        nullability: false
      - name: name
        type: Text
        nullability: false

  - name: test_select_with_limit
    sql: SELECT id FROM users LIMIT 10 OFFSET 5
    expected:
      - name: id
        type: Int
        nullability: false

  # DISTINCT Tests
  - name: test_select_distinct
    sql: SELECT DISTINCT name FROM users
    expected:
      - name: name
        type: Text
        nullability: false

  # Error Cases
  - name: test_unknown_table_error
    sql: SELECT * FROM nonexistent
    error: "Table not found"

  - name: test_unknown_column_error
    sql: SELECT nonexistent FROM users
    error: "Column not found"

  - name: test_invalid_sql_error
    sql: SELECT FROM
    error: "Parse error"

  - name: test_empty_sql
    sql: ""
    error: "No SQL"

  - name: test_multiple_statements_error
    sql: "SELECT id FROM users; SELECT id FROM users"
    error: "Multiple statements"

  - name: test_non_select_error
    sql: "INSERT INTO users (id) VALUES (1)"
    error: "Unsupported statement"
