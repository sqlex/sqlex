dialects:
- mysql
- sqlite
migrations:
- |
  CREATE TABLE users (
    id INTEGER PRIMARY KEY,
    email VARCHAR(255) UNIQUE,
    name TEXT NOT NULL,
    age INTEGER
  )
queries:
- name: single_pk_parameter
  sql: SELECT * FROM users WHERE id = ?
  cardinality: AtMostOne
  expected:
  - name: id
    nullability: false
  - name: email
    nullability: true
  - name: name
    nullability: false
  - name: age
    nullability: true
