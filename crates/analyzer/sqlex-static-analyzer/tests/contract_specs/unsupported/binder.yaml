dialects:
  - postgres
  - mysql
  - sqlite
cases:
  - name: multi_from_items
    mode: analyze
    setup:
      - CREATE TABLE t1 (id INT PRIMARY KEY)
      - CREATE TABLE t2 (id INT PRIMARY KEY)
    sql: SELECT * FROM t1, t2
    expected_codes:
      postgres: A3071
      mysql: A3071
      sqlite: A3071
  - name: top_level_values_set_expr
    mode: analyze
    sql: VALUES (1)
    expected_codes:
      postgres: A3065
      mysql: A3065
      sqlite: A3065
  - name: unsupported_binary_operator
    mode: analyze
    sql: SELECT 1 || 2
    expected_codes:
      postgres: A3069
      mysql: A3069
      sqlite: A3069
  - name: unsupported_literal_kind
    mode: analyze
    sql: SELECT X'AB'
    expected_codes:
      postgres: A3073
      mysql: A3073
      sqlite: A3073
