# PostgreSQL CTE Tests

[schema]
dialect = "postgresql"
migration = """
CREATE TABLE tree (
    id INT,
    parent_id INT,
    name VARCHAR(20)
);

INSERT INTO tree VALUES 
(1, NULL, 'Root'),
(2, 1, 'Child 1'),
(3, 1, 'Child 2'),
(4, 2, 'Grandchild 1');
"""

[[tests]]
name = "basic_cte"
query = """
WITH root_nodes AS (
    SELECT id, name FROM tree WHERE parent_id IS NULL
)
SELECT * FROM root_nodes
"""
description = "Basic CTE"

[[tests]]
name = "recursive_cte"
query = """
WITH RECURSIVE lineage AS (
    SELECT id, name, parent_id, 0 as level FROM tree WHERE parent_id IS NULL
    UNION ALL
    SELECT t.id, t.name, t.parent_id, l.level + 1
    FROM tree t JOIN lineage l ON t.parent_id = l.id
)
SELECT * FROM lineage
"""
description = "Recursive CTE"
