# PostgreSQL TOOLS Clause Tests

[schema]
dialect = "postgresql"
migration = "CREATE TABLE dummy_val (id int);"

[[tests]]
name = "values_basic"
query = """
VALUES (1, 'one'), (2, 'two')
"""
description = "Basic VALUES clause"

[[tests]]
name = "values_in_cte"
query = """
WITH t(id, name) AS (
    VALUES (1, 'one'), (2, 'two')
)
SELECT * FROM t
"""
description = "VALUES used in CTE"

[[tests]]
name = "values_type_mismatch"
query = """
VALUES (1, 'one'), ('two', 2)
"""
description = "VALUES with type mismatch"
expect_error = true
