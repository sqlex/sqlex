# MySQL Conditional Expressions Tests

[schema]
dialect = "mysql"
migration = """
CREATE TABLE conditions (
    id INT AUTO_INCREMENT PRIMARY KEY,
    val1 INTEGER,
    val2 INTEGER,
    status VARCHAR(20)
);
"""

[[tests]]
name = "case_expression"
query = """
SELECT id, 
    CASE 
        WHEN val1 > val2 THEN 'greater'
        WHEN val1 < val2 THEN 'smaller'
        ELSE 'equal_or_null' 
    END as comparison
FROM conditions
"""
description = "Simple CASE expression"

[[tests]]
name = "coalesce"
query = "SELECT id, COALESCE(val1, val2, 0) as existing_val FROM conditions"
description = "COALESCE function"

[[tests]]
name = "nullif"
query = "SELECT id, NULLIF(val1, val2) as null_if_equal FROM conditions"
description = "NULLIF function"

[[tests]]
name = "greatest_least"
query = "SELECT id, GREATEST(val1, val2) as max_val, LEAST(val1, val2) as min_val FROM conditions"
description = "GREATEST and LEAST functions"
