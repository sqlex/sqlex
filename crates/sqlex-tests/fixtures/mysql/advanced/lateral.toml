# MySQL Advanced Lateral Join Tests

[schema]
dialect = "mysql"
migration = """
CREATE TABLE departments (
    id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(100) NOT NULL
);

CREATE TABLE employees (
    id INT AUTO_INCREMENT PRIMARY KEY,
    dept_id INTEGER,
    name VARCHAR(100) NOT NULL,
    salary INTEGER,
    FOREIGN KEY (dept_id) REFERENCES departments(id)
);

CREATE TABLE projects (
    id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(100),
    leader_id INTEGER,
    FOREIGN KEY (leader_id) REFERENCES employees(id)
);
"""

[[tests]]
name = "simple_lateral"
query = """
SELECT d.name, e.name, e.salary
FROM departments d
CROSS JOIN LATERAL (
    SELECT name, salary FROM employees WHERE dept_id = d.id
) AS e
"""
description = "Simple CROSS JOIN LATERAL referencing outer table"

[[tests]]
name = "lateral_left_join"
query = """
SELECT d.name, e.top_earner
FROM departments d
LEFT JOIN LATERAL (
    SELECT name as top_earner 
    FROM employees 
    WHERE dept_id = d.id 
    ORDER BY salary DESC 
    LIMIT 1
) AS e ON true
"""
description = "LEFT JOIN LATERAL with limit and order by"

[[tests]]
name = "multi_level_lateral"
query = """
SELECT d.name as dept, p.name as project, l.name as leader
FROM departments d
CROSS JOIN LATERAL (
    SELECT id, name, leader_id FROM projects
    WHERE leader_id IN (SELECT id FROM employees WHERE dept_id = d.id)
) AS p
CROSS JOIN LATERAL (
    SELECT name FROM employees WHERE id = p.leader_id
) AS l
"""
description = "Multi-level lateral join where T3 references T2"

[[tests]]
name = "correlated_scalar_subquery"
query = """
SELECT 
    d.name,
    (SELECT AVG(salary) FROM employees WHERE dept_id = d.id) as avg_salary
FROM departments d
"""
description = "Correlated scalar subquery in projection"
