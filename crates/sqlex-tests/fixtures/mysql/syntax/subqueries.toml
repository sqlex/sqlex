# MySQL Subquery Tests

[schema]
dialect = "mysql"
migration = """
CREATE TABLE departments (
    id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(50)
);

CREATE TABLE employees (
    id INT AUTO_INCREMENT PRIMARY KEY,
    name VARCHAR(50),
    dept_id INT,
    salary INT
);
"""

[[tests]]
name = "scalar_subquery"
query = "SELECT name, (SELECT name FROM departments WHERE id = dept_id) as dept_name FROM employees"
description = "Scalar subquery in SELECT"

[[tests]]
name = "subquery_in_where"
query = "SELECT name FROM employees WHERE dept_id IN (SELECT id FROM departments WHERE name = 'Engineering')"
description = "Subquery in IN clause"

[[tests]]
name = "exists_subquery"
query = "SELECT name FROM departments d WHERE EXISTS (SELECT 1 FROM employees e WHERE e.dept_id = d.id)"
description = "EXISTS subquery"

[[tests]]
name = "derived_table"
query = "SELECT avg_sal FROM (SELECT dept_id, AVG(salary) as avg_sal FROM employees GROUP BY dept_id) as dept_stats"
description = "Subquery in FROM clause"
